# tooling-spec: python-v3
name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

# A new push to a pull request cancels that pull request's superseded run.
# A push to main gets a group of its own through the run id, so it is never
# cancelled and never queued: a repository may hang a release off that run.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                # the one sanctioned per-repo knob: repos may extend this list
                os: [windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            UV_NO_SYNC: '1'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
              with:
                  enable-cache: false
            - name: Install dependencies
              run: uv sync --locked
            - name: Format check
              run: uv run ruff format --check .
            - name: Lint
              run: uv run ruff check .
            - name: Type check
              run: uv run mypy
            - name: Run tests
              run: uv run pytest
