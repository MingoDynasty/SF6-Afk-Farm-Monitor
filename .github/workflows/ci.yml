# tooling-spec: python-v2
name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                # the one sanctioned per-repo knob: repos may extend this list
                os: [windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            UV_NO_SYNC: '1'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
              with:
                  enable-cache: false
            - name: Install dependencies
              run: uv sync --locked
            - name: Format check
              run: uv run ruff format --check .
            - name: Lint
              run: uv run ruff check .
            - name: Type check
              run: uv run mypy
            - name: Run tests
              run: uv run pytest
